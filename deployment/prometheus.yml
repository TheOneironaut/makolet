global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: makolet-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: makolet-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]

  - job_name: seaweedfs
    static_configs:
      - targets: ["seaweedfs:9327"]
